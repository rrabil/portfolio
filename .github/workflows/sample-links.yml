name: Sample link check

# Daily check that every sample/card link a recruiter could click still opens.
# Deliberately separate from the deploy pipeline in pages.yml: nothing depends
# on this job, so it never blocks a deploy. A failure opens (or updates) one
# GitHub issue labeled "broken-sample-link" and closes it once links pass again.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sample-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --config lychee.toml 'src/pages/index.js' 'src/components/SampleGrid/data.js'
          format: markdown
          output: lychee-report.md
          jobSummary: false
          fail: false
      - name: Open, update, or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          gh label create broken-sample-link --color B60205 \
            --description "A sample or card link on the portfolio does not open" 2>/dev/null || true
          existing=$(gh issue list --label broken-sample-link --state open --json number --jq '.[0].number // empty')
          if [ "$LYCHEE_EXIT_CODE" != "0" ]; then
            {
              echo "A sample or card link failed the daily check on $(date -u +%Y-%m-%d). A recruiter clicking it may hit a dead page. Fix the link, then this issue closes itself on the next passing run."
              echo
              echo "Note: domains in \`lychee.toml\` \`exclude\` are not checked. Verify those by hand in a browser."
              echo
              cat lychee-report.md
              echo
              echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > issue-body.md
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file issue-body.md
            else
              gh issue create --title "Broken sample link on the portfolio" \
                --label broken-sample-link --body-file issue-body.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All sample links passed on $(date -u +%Y-%m-%d)."
          fi
