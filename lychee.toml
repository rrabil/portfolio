# Domains excluded because Cloudflare's bot management blocks automated
# checkers there, not because the pages are actually broken:
# - researchgate.net: always returns a 403 challenge page to non-browser
#   clients (Cf-Mitigated: challenge), regardless of user agent.
# - document360.com: inconsistently 403s automated clients depending on
#   user agent/request reputation; excluded preemptively to avoid CI
#   flakiness even though it isn't a hard block like researchgate.net.
# - linkedin.com: returns a non-standard 999 status to automated clients.
exclude = [
    "https://document360.com",
    "https://www.researchgate.net",
    "https://www.linkedin.com",
]
